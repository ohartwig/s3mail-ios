# SPDX-FileCopyrightText: 2026 Kai Ole Hartwig <mail@ole-hartwig.eu>
#
# Pipeline für s3mail-ios.
#
# Sie zerfällt in zwei Hälften, und die Trennung ist der ganze Punkt:
#
#   * Die **Go-Seite der Brücke** braucht keinen Mac. Formatierung, vet und ein
#     Bau für iOS-arm64 laufen auf dem gewöhnlichen Linux-Runner. Das ist der
#     Teil, in dem die Fehler entstehen, die man ohne Xcode findet - eine
#     Signatur, die sich geändert hat, ein Feld, das die Fassade nicht mehr
#     kennt.
#
#   * Alles mit Xcode braucht einen Mac. Diese Jobs tragen `tags: [mac]` und
#     laufen **nur**, wenn `MAC_RUNNER` gesetzt ist. Ohne den Runner blieben sie
#     sonst hängen und jede Pipeline stünde auf "stuck" - eine rote Ampel, die
#     nichts über den Code aussagt.
#
# Wenn der Mac-Runner steht: Projektvariable `MAC_RUNNER = yes` setzen. Der
# Runner braucht Tag `mac` und ausdrücklich **kein** "run untagged jobs" - sonst
# nimmt er die Linux-Jobs des ganzen Bestands an und ist damit beschäftigt,
# während niemand eine App baut.

# Merge-request pipelines, and with them any automated review at all: ai:review
# runs on merge_request_event and on nothing else.
#
# The opposite stood here, with a reason that does not hold. It said a
# merge-request pipeline runs only jobs whose rules match merge_request_event --
# the .mac jobs, whose rule asks about MAC_RUNNER -- but not bridge,
# which carries no rules; a `needs` would then point at a job the pipeline does
# not contain, and GitLab would create a pipeline with no jobs at all.
#
# Measured in the core repository on 2026-08-31: there only manifest, upload and
# release carry rules, while test, .build, the four build:* and sign:macos carry
# none. Pipeline 159144 (source = merge_request_event) ran exactly those
# rule-less jobs, all six green. Rule-less jobs do take part, so the breakage
# described above cannot happen.
#
# What the old block really prevented was the duplicate pipeline for one commit,
# and that problem is real -- on the Mac more than elsewhere, because the .mac
# jobs share a resource_group and two pipelines on one commit queue behind each
# other.
#
# The obvious guard is `$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS -> never`,
# and it does not hold. It was tried here first and the review caught it: at the
# moment of a push no merge request is open yet, so the variable is empty, the
# branch pipeline runs, and creating the merge request adds a second one on the
# same commit. Measured on this branch -- pipelines 159586 (push) and 159590
# (merge_request_event), same commit, both on the Mac.
#
# So: the rule set the composed templates use, with the trade said out loud.
# Pushing to a branch with no merge request open runs NOTHING;
# `git push -o merge_request.create` does both in one step. One commit, one
# pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    # A triggered pipeline is a deliberate invocation, not a by-product of a
    # push.
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

# The automated merge-request review, as in the core repository. Dispatch only:
# this job holds no credential, it fires a downstream pipeline in
# devops/ai-code-review whose protected default branch assumes the AWS role.
#
# No `stage`, so the component's default `.post` applies. A named stage would be
# judged against the stages list below and would stop the pipeline from being
# created at all, rather than merely skipping the job.
#
# renovate: datasource=gitlab-tags depName=devops/ci-cd-components/ai-tools/ai-review
include:
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/ai-tools/ai-review@1.2.26
    inputs:
      enabled: 'true'

  # Cutting the tag is a mechanism, not a memory. This repository has never had
  # a tag at all, so there is no version history to point at when asking what
  # changed between two states of the app. The core repository had the same gap
  # and it cost it 25 unreleased commits; here it cost the ability to name a
  # state.
  #
  # release-tools/yasrt: `version` decides in .pre, `release` tags in the
  # release stage after the builds, with the job token -- the release commit
  # starts no pipeline, so no loop guard on CHANGELOG.md is needed. The tag
  # format and the non-release paths live in .yasrt.yaml; `v${version}` to
  # match the core, although nothing here matches on the tag.
  #
  # The rules are the component's own, with one addition: only on a real push
  # (or a pipeline started by hand). Since the core triggers this repository on
  # every change of its main branch (s3mail!63), those pipelines are protected,
  # carry no tag, and would otherwise satisfy the default rule.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@2
    inputs:
      stage-version: .pre
      stage-release: release
      product: custom
      tag-format: 'v${version}'
      # The note on every merge request and closed issue of a release, as
      # release:semver's success step left it.
      mr-comments: 'true'
      rules-config:
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == 'web'
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "push"
        - when: never

# The public mirror, from the estate's component: the history rewritten
# without CLAUDE.md, .claude/ and .gitlab/ (none of them is here today; the
# list is for the day one arrives), main and the v-tags force-pushed to
# GitHub with --prune. On a push to main only. The app itself ships through
# the App Store, so there is no github-release job.
#
# GITHUB_MIRROR_TOKEN is a fine-grained token with contents:write on the
# mirror repository, the one stored secret this project has.
include:
  # renovate: datasource=gitlab-tags depName=devops/ci-cd-components/extension-clean-export
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-mirror@1.4.1
    inputs:
      stage: .post
      mirror-target: 'ohartwig/s3mail-ios'
      mirror-token-var: 'GITHUB_MIRROR_TOKEN'
      strip-paths: ['CLAUDE.md', '.claude', '.gitlab']
      keep-tags: 'v*'
      prune: 'true'
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

stages:
  - test
  - build
  # `release` exists for yasrt and nothing else. Nothing in this
  # repository ships an artefact - package and app run tests - so what a release
  # buys here is the version history and the changelog, not a download.
  - release

variables:
  # Dasselbe goldene Bild wie im Kern. Zwei Go-Versionen für dasselbe Programm
  # wären zwei Möglichkeiten, unterschiedliche Ergebnisse zu bekommen.
  GO_IMAGE: "registry.ole-hartwig.eu/devops/images/golang:1.27"
  GOTOOLCHAIN: "local"
  # readonly und nicht mod: mit -mod=mod darf der Bau go.mod und go.sum
  # stillschweigend aendern, statt an einer fehlenden Abhaengigkeit zu
  # scheitern. Die CI reparierte dann ein Problem, statt es zu melden, und der
  # Auscheck auf dem Rechner bliebe kaputt. Der Kern haelt es genauso.
  GOFLAGS: "-mod=readonly"
  GOPATH: "${CI_PROJECT_DIR}/.go"
  # Der Kern kommt als Modul mit Version, wie jede andere Abhaengigkeit -
  # mobile/go.mod sagt welche. Er ist nicht oeffentlich, also holt Go ihn
  # direkt von git.ole-hartwig.eu statt ueber den Proxy und prueft ihn nicht
  # gegen die Summendatenbank (GOPRIVATE deckt beides ab). Angemeldet wird
  # mit dem Job-Token, siehe .go-private; dafuer muss dieses Projekt in der
  # Job-Token-Allowlist des Kerns stehen (seit 2026-08-31), sonst kommt ein
  # 403, das wie ein fehlendes Projekt aussieht.
  GOPRIVATE: "git.ole-hartwig.eu"

# --------------------------------------------------------------------------- #
# Anmeldung fuer den Kern
# --------------------------------------------------------------------------- #
# Zwei Wege zum selben Token, weil zwei Programme fragen: Go selbst fuer die
# go-import-Auskunft (liest NETRC), und git, das Go zum Klonen aufruft (liest
# seine Konfiguration, hier per Umgebung statt per Datei, denn auf dem Mac ist
# das Home des Runners nicht das Home dieses Jobs). Ohne Anmeldung antwortet
# GitLab auf die Auskunft nicht mit 401, sondern mit der Gruppe als Modul, und
# Go klont dann etwas, das kein Repository ist (gemessen 2026-09-14).
.go-private:
  before_script:
    - umask 077 && printf 'machine %s login gitlab-ci-token password %s\n' "${CI_SERVER_HOST}" "${CI_JOB_TOKEN}" > "${CI_PROJECT_DIR}/.netrc"
    - export NETRC="${CI_PROJECT_DIR}/.netrc"
    - |
      export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${CI_SERVER_URL}/.extraheader"
      export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'gitlab-ci-token:%s' "${CI_JOB_TOKEN}" | base64 | tr -d '\n')"

# --------------------------------------------------------------------------- #
# Die Brücke, ohne Mac
# --------------------------------------------------------------------------- #
bridge:
  stage: build
  image: ${GO_IMAGE}
  needs: []
  cache:
    key:
      files:
        - mobile/go.sum
    paths:
      - .go/pkg/mod
  before_script:
    - !reference [.go-private, before_script]
    - cd mobile
  script:
    - test -z "$(gofmt -l .)" || { echo "nicht formatiert:"; gofmt -l .; exit 1; }
    - go vet ./...
    # Gebaut wird für Linux, nicht für iOS - und das ist keine Nachlässigkeit,
    # sondern das, was hier überhaupt geht: `GOOS=ios` verlangt CGO und damit
    # eine clang-Toolchain mit iOS-SDK. Auf einem Mac ist die da, auf dem
    # Linux-Runner nicht, und der Job scheiterte an der Umgebung statt am Code.
    #
    # Für iOS baut der framework-Job auf dem Mac. Was dieser Job leistet, ist
    # der Teil, der ohne Xcode zu haben ist: dass die Fassade den Kern noch
    # kennt, dass keine Signatur weggewandert ist, dass nichts unformatiert
    # hereinkommt. Genau dort entstehen die Fehler, für die man sonst zwanzig
    # Minuten auf einen Mac wartet.
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...

# --------------------------------------------------------------------------- #
# Alles mit Xcode
# --------------------------------------------------------------------------- #
.mac:
  tags: [mac]
  variables:
    # GOPATH steht hier bewusst NICHT, sondern wird unten mit export gesetzt.
    #
    # Ein `GOPATH: "$HOME/go"` an dieser Stelle laeuft erst durch GitLabs eigene
    # Ersetzung, und GitLab kennt $HOME nicht: uebrig bleibt "/go", und der Job
    # scheitert mit "could not create module cache: mkdir /go: read-only file
    # system". Was hier steht, wird von GitLab aufgeloest, nicht von der Shell.
    GIT_DEPTH: "20"
    # git clean laeuft VOR jedem Skript, also laesst sich ein Ueberbleibsel im
    # Job nicht mehr aufraeumen - der Job stirbt vorher. Und Ueberbleibsel gibt
    # es: Gos Modul-Cache ist schreibgeschuetzt (0444), git kommt nicht heran,
    # und ein einziger Lauf mit GOPATH im Projektverzeichnis verkeilt den
    # Runner dauerhaft. Genau so ist es hier zweimal passiert.
    #
    # -e .go nimmt das Verzeichnis vom Aufraeumen aus. Damit heilt sich der
    # Runner selbst, statt dass jemand per Hand chmod und rm ausfuehren muss.
    GIT_CLEAN_FLAGS: "-ffdx -e .go"
  # Ein Rechner, ein Xcode, ein Simulator - und der Shell-Executor legt Jobs
  # desselben Projekts ins selbe Verzeichnis. Zwei `xcodebuild test`
  # gleichzeitig treten sich dort gegenseitig auf die Fuesse, und der Fehler
  # sieht jedes Mal anders aus. resource_group laesst nur einen Mac-Job zur
  # Zeit laufen.
  resource_group: mac
  rules:
    # Ohne Runner keine Jobs - und ohne Jobs auch keine Pipeline, die auf
    # "stuck" steht und nichts über den Code aussagt.
    - if: $MAC_RUNNER == "yes"
  needs: []
  before_script:
    - !reference [.go-private, before_script]
    # GOPATH aus dem Projektverzeichnis heraus, und per export statt per
    # variables: nur die Shell kennt $HOME.
    #
    # Warum ueberhaupt heraus: Gos Modul-Cache ist absichtlich
    # schreibgeschuetzt (0444), damit niemand versehentlich eine Abhaengigkeit
    # aendert. Der Shell-Executor behaelt sein Arbeitsverzeichnis zwischen
    # Laeufen, und `git clean` kommt an diese Dateien nicht heran - der
    # naechste Job stirbt dann beim Auschecken mit "Permission denied", lange
    # vor dem ersten Skript. Unter Docker faellt das nie auf, weil jeder Job
    # einen frischen Container bekommt.
    #
    # Nebenbei schneller: der Cache ueberlebt auf der Maschine.
    - export GOPATH="$HOME/go"
    # Was auf diesem Rechner ueberhaupt steht - drei Zeilen, die beim ersten
    # Fehlschlag auf einem neuen Bau-Rechner die halbe Fehlersuche sparen.
    # Beim allerersten Lauf war es "gomobile: command not found", und ohne das
    # hier raet man, ob Go fehlt, Xcode, oder nur ein Pfad.
    - go version || echo "kein Go auf diesem Runner"
    - xcodebuild -version | head -2
    - xcrun simctl list runtimes | grep -i ios || echo "keine iOS-Laufzeit - xcodebuild -downloadPlatform iOS"

framework:
  extends: .mac
  stage: build
  script:
    - make framework
  artifacts:
    paths:
      - S3mailCore.xcframework
    expire_in: 1 day

package:
  extends: .mac
  stage: build
  needs: [framework]
  script:
    # Die Tests gegen ein echtes Postfach überspringen sich ohne Zugangsdaten
    # still. Das ist hier richtig: die Pipeline soll nicht in fremde Post sehen.
    # Wer sie laufen lassen will, setzt TEST_RUNNER_S3MAIL_* als geschützte
    # Variablen - das Präfix ist Pflicht, xcodebuild reicht nichts anderes an
    # das Testbündel weiter.
    - make test

app:
  extends: .mac
  stage: build
  needs: [framework]
  script:
    # Der Simulator verlangt keine Signatur, und ein Signaturschlüssel auf dem
    # Bau-Runner wäre ein Schlüssel mehr, der dort nichts zu suchen hat.
    # Signiert wird beim Verteilen, nicht beim Prüfen.
    - make app-test
