# SPDX-FileCopyrightText: 2026 Kai Ole Hartwig <mail@ole-hartwig.eu>
#
# Pipeline for s3mail-ios.
#
# It falls into two halves, and the split is the whole point:
#
#   * The **Go side of the bridge** needs no Mac. Formatting, vet and a build
#     run on the ordinary Linux runner. That is where the errors happen that
#     one finds without Xcode - a signature that changed, a field the facade
#     no longer knows.
#
#   * Everything with Xcode needs a Mac. Those jobs carry `tags: [mac]` and run
#     **only** when `MAC_RUNNER` is set. Without the runner they would hang,
#     and every pipeline would sit on "stuck" - a red light that says nothing
#     about the code.
#
# When the Mac runner is up: set the project variable `MAC_RUNNER = yes`. The
# runner needs the tag `mac` and explicitly **no** "run untagged jobs" -
# otherwise it picks up the Linux jobs of the whole estate and is busy with
# them while nobody builds an app.

# Merge-request pipelines, and with them any automated review at all: ai:review
# runs on merge_request_event and on nothing else.
#
# The opposite stood here, with a reason that does not hold. It said a
# merge-request pipeline runs only jobs whose rules match merge_request_event --
# the .mac jobs, whose rule asks about MAC_RUNNER -- but not bridge,
# which carries no rules; a `needs` would then point at a job the pipeline does
# not contain, and GitLab would create a pipeline with no jobs at all.
#
# Measured in the core repository on 2026-08-31: there only manifest, upload and
# release carry rules, while test, .build, the four build:* and sign:macos carry
# none. Pipeline 159144 (source = merge_request_event) ran exactly those
# rule-less jobs, all six green. Rule-less jobs do take part, so the breakage
# described above cannot happen.
#
# What the old block really prevented was the duplicate pipeline for one commit,
# and that problem is real -- on the Mac more than elsewhere, because the .mac
# jobs share a resource_group and two pipelines on one commit queue behind each
# other.
#
# The obvious guard is `$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS -> never`,
# and it does not hold. It was tried here first and the review caught it: at the
# moment of a push no merge request is open yet, so the variable is empty, the
# branch pipeline runs, and creating the merge request adds a second one on the
# same commit. Measured on this branch -- pipelines 159586 (push) and 159590
# (merge_request_event), same commit, both on the Mac.
#
# So: the rule set the composed templates use, with the trade said out loud.
# Pushing to a branch with no merge request open runs NOTHING;
# `git push -o merge_request.create` does both in one step. One commit, one
# pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    # A triggered pipeline is a deliberate invocation, not a by-product of a
    # push.
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

# One include list. Two `include:` keys in one file are legal YAML and the
# second silently wins: for one day (2026-09-15) the mirror's own `include:`
# shadowed this one, and main ran without version, release and ai:review.
include:
  # The automated merge-request review, as in the core repository. Dispatch
  # only: this job holds no credential, it fires a downstream pipeline in
  # devops/ai-code-review whose protected default branch assumes the AWS role.
  #
  # No `stage`, so the component's default `.post` applies. A named stage
  # would be judged against the stages list below and would stop the pipeline
  # from being created at all, rather than merely skipping the job.
  #
  # renovate: datasource=gitlab-tags depName=devops/ci-cd-components/ai-tools/ai-review
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/ai-tools/ai-review@1.2.26
    inputs:
      enabled: 'true'

  # Cutting the tag is a mechanism, not a memory. This repository has never had
  # a tag at all, so there is no version history to point at when asking what
  # changed between two states of the app. The core repository had the same gap
  # and it cost it 25 unreleased commits; here it cost the ability to name a
  # state.
  #
  # release-tools/yasrt: `version` decides in .pre, `release` tags in the
  # release stage after the builds, with the job token -- the release commit
  # starts no pipeline, so no loop guard on CHANGELOG.md is needed. The tag
  # format and the non-release paths live in .yasrt.yaml; `v${version}` to
  # match the core, although nothing here matches on the tag.
  #
  # The rules are the component's own, with one addition: only on a real push
  # (or a pipeline started by hand). A triggered pipeline is protected, carries
  # no tag, and would otherwise satisfy the default rule.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@2
    inputs:
      stage-version: .pre
      stage-release: release
      product: custom
      tag-format: 'v${version}'
      # The note on every merge request and closed issue of a release, as
      # release:semver's success step left it.
      mr-comments: 'true'
      rules-config:
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == 'web'
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "push"
        - when: never

  # The public mirror, from the estate's component: the history rewritten
  # without CLAUDE.md, .claude/ and .gitlab/ (none of them is here today; the
  # list is for the day one arrives), main and the v-tags force-pushed to
  # GitHub with --prune. On a push to main, or a run started by hand there.
  # The app itself ships through the App Store, so there is no github-release
  # job.
  #
  # GITHUB_MIRROR_TOKEN is a fine-grained token with contents:write on the
  # mirror repository, the one stored secret this project has.
  # renovate: datasource=gitlab-tags depName=devops/ci-cd-components/extension-clean-export
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-mirror@1.5.0
    inputs:
      stage: .post
      mirror-target: 'ohartwig/s3mail-ios'
      mirror-token-var: 'GITHUB_MIRROR_TOKEN'
      strip-paths: ['CLAUDE.md', '.claude', '.gitlab']
      keep-tags: 'v*'
      prune: 'true'
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        # push, web and api: a run started by hand on main mirrors too - the
        # first fill of the repository on GitHub was exactly that.
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")

stages:
  - test
  - build
  # `release` exists for yasrt and nothing else. Nothing in this
  # repository ships an artefact - package and app run tests - so what a release
  # buys here is the version history and the changelog, not a download.
  - release

variables:
  # The same golden image as the core. Two Go versions for the same program
  # would be two ways of getting different results.
  GO_IMAGE: "registry.ole-hartwig.eu/devops/images/golang:1.27"
  GOTOOLCHAIN: "local"
  # readonly, not mod: with -mod=mod the build may silently change go.mod and
  # go.sum instead of failing on a missing dependency. CI would then repair a
  # problem instead of reporting it, and the checkout on the desk would stay
  # broken. The core does the same.
  GOFLAGS: "-mod=readonly"
  GOPATH: "${CI_PROJECT_DIR}/.go"
  # The core is a versioned dependency like any other - mobile/go.mod says
  # which version - and fetched like any other, through the proxy and the
  # checksum database: it is public, github.com/ohartwig/s3mail. Until
  # 2026-09-15 it came from git.ole-hartwig.eu, with GOPRIVATE and a job-token
  # login; both went with the mirror.

# --------------------------------------------------------------------------- #
# The bridge, without a Mac
# --------------------------------------------------------------------------- #
bridge:
  stage: build
  image: ${GO_IMAGE}
  needs: []
  cache:
    key:
      files:
        - mobile/go.sum
    paths:
      - .go/pkg/mod
  before_script:
    - cd mobile
  script:
    - test -z "$(gofmt -l .)" || { echo "not formatted:"; gofmt -l .; exit 1; }
    - go vet ./...
    # Built for Linux, not for iOS - and that is not carelessness but what is
    # possible here at all: `GOOS=ios` needs CGO and with it a clang toolchain
    # with the iOS SDK. A Mac has it, the Linux runner does not, and the job
    # failed on the environment rather than on the code.
    #
    # For iOS, the framework job builds on the Mac. What this job delivers is
    # the part that is to be had without Xcode: that the facade still knows
    # the core, that no signature has wandered off, that nothing arrives
    # unformatted. That is exactly where the errors happen that one would
    # otherwise wait twenty minutes on a Mac for.
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...

# --------------------------------------------------------------------------- #
# Everything with Xcode
# --------------------------------------------------------------------------- #
.mac:
  tags: [mac]
  variables:
    # GOPATH is deliberately NOT here; it is exported below.
    #
    # A `GOPATH: "$HOME/go"` at this point first runs through GitLab's own
    # substitution, and GitLab does not know $HOME: what remains is "/go", and
    # the job fails with "could not create module cache: mkdir /go: read-only
    # file system". What stands here is resolved by GitLab, not by the shell.
    GIT_DEPTH: "20"
    # git clean runs BEFORE every script, so a leftover cannot be cleaned up
    # inside the job any more - the job dies first. And there are leftovers:
    # Go's module cache is write-protected (0444), git cannot get at it, and a
    # single run with GOPATH inside the project directory jams the runner for
    # good. That is exactly what happened here, twice.
    #
    # -e .go excludes the directory from the cleanup. The runner then heals
    # itself instead of somebody running chmod and rm by hand.
    GIT_CLEAN_FLAGS: "-ffdx -e .go"
  # One machine, one Xcode, one simulator - and the shell executor puts jobs of
  # the same project into the same directory. Two `xcodebuild test` at the same
  # time step on each other's toes there, and the error looks different every
  # time. resource_group lets only one Mac job run at a time.
  resource_group: mac
  rules:
    # No runner, no jobs - and no jobs, no pipeline that sits on "stuck" and
    # says nothing about the code.
    - if: $MAC_RUNNER == "yes"
  needs: []
  before_script:
    # GOPATH out of the project directory, and by export rather than by
    # variables: only the shell knows $HOME.
    #
    # Why out at all: Go's module cache is deliberately write-protected (0444)
    # so that nobody changes a dependency by accident. The shell executor keeps
    # its working directory between runs, and `git clean` cannot get at those
    # files - the next job then dies at checkout with "Permission denied", long
    # before the first script. Under Docker this never shows, because every
    # job gets a fresh container.
    #
    # Faster as a side effect: the cache survives on the machine.
    - export GOPATH="$HOME/go"
    # What is on this machine at all - three lines that save half the
    # troubleshooting on the first failure on a new build machine. On the very
    # first run it was "gomobile: command not found", and without this one
    # guesses whether Go is missing, Xcode, or just a path.
    - go version || echo "no Go on this runner"
    - xcodebuild -version | head -2
    - xcrun simctl list runtimes | grep -i ios || echo "no iOS runtime - xcodebuild -downloadPlatform iOS"

framework:
  extends: .mac
  stage: build
  script:
    - make framework
  artifacts:
    paths:
      - S3mailCore.xcframework
    expire_in: 1 day

package:
  extends: .mac
  stage: build
  needs: [framework]
  script:
    # The tests against a real mailbox skip silently without credentials. That
    # is right here: the pipeline must not look into somebody's mail. Whoever
    # wants them to run sets TEST_RUNNER_S3MAIL_* as protected variables - the
    # prefix is mandatory, xcodebuild passes nothing else to the test bundle.
    - make test

app:
  extends: .mac
  stage: build
  needs: [framework]
  script:
    # The simulator demands no signature, and a signing key on the build runner
    # would be one more key that has no business there. Signing happens when
    # distributing, not when testing.
    - make app-test
